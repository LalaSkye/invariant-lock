[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariant-lock"
version = "0.1.0"
description = "Prevent silent drift in invariants. Refuse execution unless version increments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
invariant-lock = "invariant_lock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_lock"]
